name: Bug report
description: Report a reproducible Cloud Tasks problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include a real server URL, username, app password, task content,
        database, or exported calendar. Report vulnerabilities privately using
        SECURITY.md.

  - type: input
    id: app-version
    attributes:
      label: Cloud Tasks version
      placeholder: 1.0.0+19
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Android and Nextcloud versions
      description: Include the device OS and server/Tasks app versions, without identifying the server.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, server identifiers, and private task data.
          required: true
