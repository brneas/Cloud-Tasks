name: cloud_tasks
description: A privacy-respecting, offline-first Flutter client for Nextcloud Tasks.
publish_to: none
version: 1.0.0+20

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  file_selector: 1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^10.3.4
  flutter_local_notifications: ^22.3.1
  http: ^1.6.0
  path: ^1.9.1
  rrule: ^0.2.18
  sqflite: ^2.4.1
  share_plus: ^10.1.4
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  workmanager: 0.10.10
  xml: ^7.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/cloud_tasks_icon.png
  adaptive_icon_background: "#0082C9"
  adaptive_icon_foreground: assets/branding/cloud_tasks_icon_foreground.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 24

flutter:
  uses-material-design: true
